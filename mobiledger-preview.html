<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobiLedger Cloud</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#f5f7fb;color:#182033}button,input,select{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0b1220;color:#aab6c8;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;color:#fff;font-size:18px;font-weight:800;padding:5px 8px 18px}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#635bff,#00a8c6);display:grid;place-items:center}.shop{padding:11px;background:#121e33;border:1px solid #1d2b43;border-radius:12px;margin-bottom:16px}.shop b{display:block;color:#fff;font-size:12px}.shop small{font-size:10px}.sec{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#56657a;margin:15px 9px 7px;font-weight:800}.nav button{width:100%;border:0;background:transparent;color:#aab6c8;text-align:left;padding:9px 10px;border-radius:9px;font-size:12px;margin:2px 0}.nav button:hover,.nav button.on{background:#182643;color:#fff}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;padding:0 23px;position:sticky;top:0;z-index:2}.top h1{font-size:18px;margin:0}.top small{display:block;color:#7b8494}.top .right{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700;font-size:11px}.primary{background:#554cf0;color:#fff}.ghost{background:#fff;border:1px solid #dfe4ec}.content{padding:22px;max-width:1500px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid #e5e9f0;border-radius:14px;box-shadow:0 8px 25px rgba(15,23,42,.05)}.card{padding:15px}.card small{color:#748094;font-size:10px;font-weight:700}.card strong{display:block;font-size:22px;margin:7px 0}.up{color:#07875c;font-size:10px}.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:14px}.panel h3{font-size:12px;margin:0;padding:14px 15px;border-bottom:1px solid #edf0f4}.body{padding:15px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{padding:13px;text-align:left;border:1px solid #e4e8ef;background:#fff;border-radius:10px}.quick b{display:block;font-size:11px}.quick small{color:#7d8796;font-size:9px}.bars{height:190px;display:flex;align-items:end;gap:10px;border-bottom:1px solid #eef1f5;padding:10px}.bars div{flex:1;background:linear-gradient(#7069fa,#5148e5);border-radius:5px 5px 0 0}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{font-size:9px;text-transform:uppercase;color:#718096;background:#f8fafc;text-align:left;padding:9px;border-bottom:1px solid #e6eaf0}.table td{font-size:10px;padding:10px;border-bottom:1px solid #edf0f4}.scroll{overflow:auto}.tag{padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800;background:#eef2ff;color:#4338ca}.green{background:#ecfdf5;color:#047857}.orange{background:#fff7ed;color:#c2410c}.red{background:#fef2f2;color:#b91c1c}.form{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.f{grid-column:span 4}.f.w6{grid-column:span 6}.f.w12{grid-column:span 12}.f label{display:block;font-size:9px;text-transform:uppercase;font-weight:800;color:#697386;margin-bottom:5px}.f input,.f select{width:100%;border:1px solid #dfe4ec;border-radius:8px;padding:9px;font-size:10px}.scan{display:flex;gap:8px;margin:13px 0}.scan input{flex:1;border:1px solid #dfe4ec;border-radius:8px;padding:9px}.summary{background:#f8fafc;border:1px solid #e7ebf1;border-radius:11px;padding:12px}.row{display:flex;justify-content:space-between;padding:6px 0;font-size:10px}.row.total{font-size:14px;font-weight:800;border-top:1px dashed #cbd5e1;margin-top:5px;padding-top:10px}.toolbar{display:flex;gap:7px;margin-bottom:13px;align-items:center}.toolbar .sp{flex:1}.tabs{display:flex;background:#eef1f5;border-radius:9px;padding:3px}.tabs button{border:0;background:transparent;padding:7px 10px;border-radius:7px;font-size:10px}.tabs button.on{background:#fff;box-shadow:0 1px 4px #ccd3df}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:9}.box{background:#fff;border-radius:15px;width:min(760px,95vw);max-height:85vh;overflow:auto;padding:18px}.box h3{margin:0 0 15px}.hide{display:none}.note{font-size:9px;color:#6b7280;background:#eef2ff;border:1px dashed #c7d2fe;padding:9px;border-radius:8px}.list{display:grid;gap:8px}.list div{border:1px solid #e7ebf1;border-radius:9px;padding:10px;font-size:10px;display:flex;justify-content:space-between}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#09111f,#28236b)}.loginbox{width:min(410px,92vw);background:#fff;border-radius:20px;padding:28px;box-shadow:0 25px 80px #0005}.loginbox h2{margin:8px 0}.loginbox input{width:100%;padding:11px;border:1px solid #dfe4ec;border-radius:9px;margin:6px 0 12px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.sec{grid-column:1/-1}.kpis{grid-template-columns:1fr}.content{padding:12px}.f,.f.w6,.f.w12{grid-column:span 12}}</style></head><body><div id="root"></div><script>const I={stock:[['352099001760481','Apple','iPhone 15 Pro','256GB','City Telecom',330000,349000,'In Stock'],['862394067118225','Samsung','S25 Ultra','12/256','M&P',295000,318000,'In Stock'],['867421061032914','Vivo','X200 Pro','16/512','Vivo Dist.',278000,295000,'In Stock'],['354710118839101','Infinix','Hot 70 Pro 5G','8/256','Advance',61800,65999,'In Stock'],['356781090011223','Apple','iPhone 14','128GB','City Telecom',212000,229000,'Sold']],sales:[['SI-260916-0042','Usman Traders',159999,80000,79999],['SI-260915-0038','Ahmed Mobiles',229000,129000,100000]],customers:[['Ahmed Mobiles',500000,186000],['Usman Traders',800000,420000],['New Mobile Zone',350000,92000]],cheques:[['742801','HBL','Ahmed Mobiles',120000,'20 Sep','Pending'],['120887','Meezan','City Telecom',250000,'18 Sep','Pending'],['001905','HBL','New Mobile Zone',90000,'10 Sep','Bounced']]};let page='Dashboard',cart=[];const root=document.getElementById('root'),rs=n=>'Rs '+Number(n).toLocaleString('en-PK');function login(){root.innerHTML='<div class="login"><div class="loginbox"><div class="brand" style="color:#111827;padding:0"><span class="logo">M</span>MobiLedger Cloud</div><h2>Mobile Market ERP</h2><p style="color:#6b7280;font-size:12px">Advanced retailer + wholesaler demo</p><input value="owner@demo.pk"><input type="password" value="123456"><button class="btn primary" style="width:100%" onclick="app()">Open Demo Workspace</button><p class="note" style="margin-top:14px">Demo credentials are prefilled. This preview uses sample data.</p></div></div>'}function app(){root.innerHTML='<div class="app"><aside class="side"><div class="brand"><span class="logo">M</span>MobiLedger</div><div class="shop"><b>Galaxy Mobile Center</b><small>Wholesale + Retail · Lahore</small></div><div class="nav">'+nav('Business',['Dashboard','Sale Invoice','Purchase','IMEI Inventory','Customers & Vendors'])+nav('Adjustments',['Returns','Rebate Adjustment'])+nav('Accounts',['Accounts & Vouchers','Cheque Management','Reports'])+nav('Management',['Branches & Transfers','Users & Rights','Audit Log'])+nav('SaaS',['Subscription Admin','Settings'])+'</div></aside><main class="main"><div class="top"><div><h1 id="title"></h1><small id="sub">Advanced mobile market ERP</small></div><div class="right"><button class="btn ghost" onclick="showSearch()">IMEI Search</button><button class="btn primary" onclick="go(\'Sale Invoice\')">+ New Sale</button></div></div><section class="content" id="content"></section></main></div>';go('Dashboard')}function nav(s,a){return '<div class="sec">'+s+'</div>'+a.map(x=>'<button data-p="'+x+'" onclick="go(\''+x+'\')">'+x+'</button>').join('')}function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));document.getElementById('title').textContent=p;const C=document.getElementById('content');if(p==='Dashboard')dash(C);else if(p==='Sale Invoice')sale(C);else if(p==='Purchase')purchase(C);else if(p==='IMEI Inventory')inventory(C);else if(p==='Customers & Vendors')parties(C);else if(p==='Returns')returns(C);else if(p==='Rebate Adjustment')rebate(C);else if(p==='Accounts & Vouchers')accounts(C);else if(p==='Cheque Management')cheques(C);else if(p==='Reports')reports(C);else if(p==='Branches & Transfers')branches(C);else if(p==='Users & Rights')users(C);else if(p==='Audit Log')audit(C);else if(p==='Subscription Admin')subs(C);else settings(C)}function card(a,b,c){return '<div class="card"><small>'+a+'</small><strong>'+b+'</strong><span class="up">'+c+'</span></div>'}function dash(C){C.innerHTML='<div class="kpis">'+card('Today Sales',rs(660500),'+12.4%')+card('Gross Profit',rs(76400),'+9.1%')+card('Stock Value',rs(57870000),'613 units')+card('Receivable',rs(698000),'4 customers')+card('Payable',rs(1417600),'5 suppliers')+'</div><div class="grid2"><div class="panel"><h3>Sales Trend · Last 7 Days</h3><div class="body"><div class="bars"><div style="height:38%"></div><div style="height:55%"></div><div style="height:45%"></div><div style="height:70%"></div><div style="height:80%"></div><div style="height:66%"></div><div style="height:92%"></div></div></div></div><div class="panel"><h3>Quick Actions</h3><div class="body quick">'+['Sale Invoice','Purchase','IMEI Inventory','Returns','Accounts & Vouchers','Reports'].map(x=>'<button onclick="go(\''+x+'\')"><b>'+x+'</b><small>Open module</small></button>').join('')+'</div></div></div><div class="panel" style="margin-top:14px"><h3>Recent Sales</h3>'+salesTable()+'</div>'}function salesTable(){return '<div class="scroll"><table class="table"><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th></tr>'+I.sales.map(s=>'<tr><td><b>'+s[0]+'</b></td><td>'+s[1]+'</td><td>'+rs(s[2])+'</td><td>'+rs(s[3])+'</td><td>'+rs(s[4])+'</td></tr>').join('')+'</table></div>'}function sale(C){C.innerHTML='<div class="grid2"><div class="panel"><h3>New Sale Invoice · IMEI Auto Detection</h3><div class="body"><div class="form"><div class="f w6"><label>Customer</label><select id="cust"><option>Walk-in Customer</option><option>Ahmed Mobiles</option><option>Usman Traders</option></select></div><div class="f"><label>Salesperson</label><select><option>Ali Raza</option></select></div></div><div class="scan"><input id="si" placeholder="Scan / enter IMEI"><button class="btn primary" onclick="addSale()">Add Device</button></div><p class="note">Try 352099001760481 or 862394067118225. Duplicate and sold IMEIs are blocked.</p><div id="cart"></div></div></div><div class="panel"><h3>Payment Summary</h3><div class="body"><div class="summary" id="sum"></div><div class="f w12" style="margin-top:12px"><label>Cash Paid</label><input id="paid" type="number" value="0"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="postSale()">Save & Post Invoice</button></div></div></div>';drawCart()}function addSale(){let q=document.getElementById('si').value.trim(),x=I.stock.find(s=>s[0]===q||s[0].endsWith(q));if(!x)return alert('IMEI not found');if(x[7]!=='In Stock')return alert('This IMEI is '+x[7]);if(cart.some(y=>y[0]===x[0]))return alert('Already added');cart.push(x);drawCart()}function drawCart(){let c=document.getElementById('cart'),s=document.getElementById('sum');if(!c)return;c.innerHTML='<div class="scroll"><table class="table"><tr><th>IMEI</th><th>Device</th><th>Cost</th><th>Sale</th></tr>'+cart.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+' '+x[2]+' '+x[3]+'</td><td>'+rs(x[5])+'</td><td>'+rs(x[6])+'</td></tr>').join('')+'</table></div>';let n=cart.reduce((a,b)=>a+b[6],0);s.innerHTML='<div class="row"><span>Devices</span><b>'+cart.length+'</b></div><div class="row total"><span>Net Total</span><span>'+rs(n)+'</span></div>';document.getElementById('paid').value=n}function postSale(){if(!cart.length)return alert('Add an IMEI first');cart.forEach(x=>x[7]='Sold');let total=cart.reduce((a,b)=>a+b[6],0);I.sales.unshift(['SI-DEMO-'+(I.sales.length+1),document.getElementById('cust').value,total,Number(document.getElementById('paid').value||0),0]);cart=[];alert('Invoice posted. Inventory and accounts updated.');go('Dashboard')}function purchase(C){C.innerHTML='<div class="panel"><h3>Purchase Voucher · Supplier + Inventory + Accounts</h3><div class="body"><div class="form"><div class="f"><label>Supplier</label><select><option>City Telecom</option><option>M&P</option><option>Advance</option></select></div><div class="f"><label>Branch</label><select><option>Warehouse</option><option>Main Branch</option></select></div><div class="f"><label>Invoice Ref</label><input></div><div class="f"><label>Brand</label><input value="Samsung"></div><div class="f"><label>Model</label><input value="Galaxy A56"></div><div class="f"><label>Variant</label><input value="8/256"></div><div class="f"><label>Cost</label><input value="112000"></div><div class="f"><label>Sale Price</label><input value="121999"></div><div class="f"><label>IMEI</label><input placeholder="Scan serial"></div></div><p class="note" style="margin-top:12px">Purchase supports warranty, barcode integration, attribute expenses, cash/credit/partial payment and duplicate IMEI protection.</p><button class="btn primary" style="margin-top:12px" onclick="alert(\'Purchase voucher demo posted\')">Post Purchase</button></div></div>'}function inventory(C){C.innerHTML='<div class="toolbar"><span class="tag green">613 Available</span><span class="sp"></span><button class="btn ghost" onclick="showSearch()">IMEI History</button></div><div class="panel"><h3>Serialized Inventory</h3><div class="scroll"><table class="table"><tr><th>IMEI</th><th>Brand</th><th>Model</th><th>Variant</th><th>Supplier</th><th>Cost</th><th>Sale</th><th>Status</th></tr>'+I.stock.map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td><td>'+x[4]+'</td><td>'+rs(x[5])+'</td><td>'+rs(x[6])+'</td><td><span class="tag '+(x[7]==='In Stock'?'green':'')+'">'+x[7]+'</span></td></tr>').join('')+'</table></div></div>'}function parties(C){C.innerHTML='<div class="kpis">'+card('Receivable',rs(698000),'Customer balances')+card('Payable',rs(1417600),'Supplier balances')+card('Credit Alerts','1','Debit limit control')+'</div><div class="panel" style="margin-top:14px"><h3>Customers & Credit Limits</h3><div class="scroll"><table class="table"><tr><th>Customer</th><th>Limit</th><th>Balance</th><th>Status</th></tr>'+I.customers.map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+rs(x[1])+'</td><td>'+rs(x[2])+'</td><td><span class="tag green">Within Limit</span></td></tr>').join('')+'</table></div></div>'}function returns(C){C.innerHTML='<div class="grid2"><div class="panel"><h3>Sale Return</h3><div class="body"><div class="scan"><input value="356781090011223"><button class="btn primary" onclick="alert(\'Original sale, customer, warranty and price detected; return can be posted.\')">Detect by IMEI</button></div><p class="note">Return reverses customer ledger, sales and stock automatically.</p></div></div><div class="panel"><h3>Purchase Return</h3><div class="body"><div class="scan"><input value="352099001760481"><button class="btn primary" onclick="alert(\'Supplier and purchase cost detected; purchase return ready.\')">Detect by IMEI</button></div><p class="note">Purchase return reverses vendor ledger and inventory.</p></div></div></div>'}function rebate(C){C.innerHTML='<div class="panel"><h3>Supplier Rebate Adjustment</h3><div class="body"><div class="form"><div class="f w6"><label>Supplier</label><select><option>City Telecom</option><option>M&P</option></select></div><div class="f"><label>Rebate / Unit</label><input value="1000"></div></div><p class="note" style="margin-top:12px">Eligible in-stock products from selected supplier are auto-detected. Posting reduces inventory value and creates accounting journal entries.</p><button class="btn primary" style="margin-top:12px" onclick="alert(\'Rebate adjustment posted in demo\')">Post Rebate</button></div></div>'}function accounts(C){C.innerHTML='<div class="kpis">'+card('Cash in Hand',rs(748000),'Current')+card('Bank Balance',rs(1400000),'3 banks')+card('Receivable',rs(698000),'Customers')+card('Payable',rs(1417600),'Suppliers')+'</div><div class="grid2"><div class="panel"><h3>4-Level Chart of Accounts</h3><div class="body list"><div><b>1000 · Assets</b><span>'+rs(60470000)+'</span></div><div><span>1100 · Current Assets</span><span>'+rs(60200000)+'</span></div><div><span>111001 · Cash in Hand</span><span>'+rs(748000)+'</span></div><div><b>2000 · Liabilities</b><span>'+rs(1417600)+'</span></div><div><b>4000 · Revenue</b><span>'+rs(9840000)+'</span></div><div><b>5000 · Expenses</b><span>'+rs(2180000)+'</span></div></div></div><div class="panel"><h3>Vouchers</h3><div class="body quick">'+['Cash Received','Cash Payment','Bank Received','Bank Payment','Journal Voucher'].map(x=>'<button onclick="alert(\''+x+' entry form\')"><b>'+x+'</b><small>Auto double entry</small></button>').join('')+'</div></div></div>'}function cheques(C){C.innerHTML='<div class="kpis">'+card('Pending Receivable',rs(120000),'1 cheque')+card('Pending Payable',rs(250000),'1 cheque')+card('Bounced',rs(90000),'Needs action')+'</div><div class="panel" style="margin-top:14px"><h3>Post-Dated Cheques</h3><div class="scroll"><table class="table"><tr><th>#</th><th>Bank</th><th>Party</th><th>Amount</th><th>Due</th><th>Status</th></tr>'+I.cheques.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+rs(x[3])+'</td><td>'+x[4]+'</td><td><span class="tag '+(x[5]==='Bounced'?'red':'orange')+'">'+x[5]+'</span></td></tr>').join('')+'</table></div></div>'}function reports(C){let r=['Sales Reports','Purchase Reports','Stock & IMEI Reports','Receivable Aging','General Journal','Trial Balance','Profit & Loss','Balance Sheet','Cash Flow','Cheque Reports','Rebate Reports','User Activity'];C.innerHTML='<div class="quick" style="grid-template-columns:repeat(3,1fr)">'+r.map(x=>'<button onclick="alert(\''+x+' preview / export\')"><b>'+x+'</b><small>Filter · Print · Excel · PDF</small></button>').join('')+'</div><div class="grid2"><div class="panel"><h3>P&L Snapshot</h3><div class="body"><div class="row"><span>Net Sales</span><b>'+rs(9840000)+'</b></div><div class="row"><span>COGS</span><b>'+rs(7860000)+'</b></div><div class="row"><span>Gross Profit</span><b>'+rs(1980000)+'</b></div><div class="row total"><span>Net Profit</span><span>'+rs(1168000)+'</span></div></div></div><div class="panel"><h3>Receivable Aging</h3><div class="body list"><div><span>Current</span><b>'+rs(338000)+'</b></div><div><span>1–15 Days</span><b>'+rs(396000)+'</b></div><div><span>16–30 Days</span><b>'+rs(174000)+'</b></div><div><span>31–60 Days</span><b>'+rs(90000)+'</b></div></div></div></div>'}function branches(C){C.innerHTML='<div class="kpis">'+card('Main Branch','128 units',rs(17650000))+card('Gulberg','73 units',rs(8420000))+card('Warehouse','412 units',rs(32800000))+'</div><div class="panel" style="margin-top:14px"><h3>Serialized Stock Transfer</h3><div class="body"><div class="form"><div class="f"><label>From</label><select><option>Warehouse</option></select></div><div class="f"><label>To</label><select><option>Main Branch</option><option>Gulberg</option></select></div><div class="f"><label>IMEI</label><input value="352099001760481"></div></div><button class="btn primary" style="margin-top:12px" onclick="alert(\'Transfer created; IMEI movement history updated\')">Post Transfer</button></div></div>'}function users(C){C.innerHTML='<div class="panel"><h3>Users & Rights</h3><div class="scroll"><table class="table"><tr><th>User</th><th>Role</th><th>Branch</th><th>Profit View</th><th>Accounts</th><th>Status</th></tr><tr><td>Arslan</td><td>Administrator</td><td>All</td><td>Yes</td><td>Full</td><td><span class="tag green">Active</span></td></tr><tr><td>Ali Raza</td><td>Salesman</td><td>Main</td><td>No</td><td>No</td><td><span class="tag green">Active</span></td></tr><tr><td>Hamza</td><td>Cashier</td><td>Gulberg</td><td>No</td><td>Vouchers</td><td><span class="tag green">Active</span></td></tr></table></div></div><p class="note" style="margin-top:12px">Rights can be controlled module-wise and report-wise; optional password verification can be required on save.</p>'}function audit(C){C.innerHTML='<div class="panel"><h3>Operating History</h3><div class="body list"><div><span>6:12 PM · Ali Raza · Created Sale Invoice SI-0042</span><b>'+rs(159999)+'</b></div><div><span>5:48 PM · Arslan · Updated Ahmed Mobiles credit limit</span><b>Rs 500k</b></div><div><span>4:35 PM · Waqas · Warehouse → Gulberg stock transfer</span><b>12 IMEIs</b></div><div><span>3:20 PM · Hamza · Cash expense saved</span><b>'+rs(3200)+'</b></div></div></div>'}function subs(C){C.innerHTML='<div class="kpis">'+card('Active Shops','3','Demo tenants')+card('Demo MRR',rs(4597),'Monthly recurring')+card('Due This Week','2','Renewals')+card('Expired','1','Read-only')+'</div><div class="panel" style="margin-top:14px"><h3>Subscription Admin</h3><div class="scroll"><table class="table"><tr><th>Shop</th><th>Plan</th><th>Monthly</th><th>Renewal</th><th>Status</th></tr><tr><td>Galaxy Mobile Center</td><td>Wholesale Pro</td><td>Rs 1,999</td><td>02 Oct</td><td><span class="tag green">Active</span></td></tr><tr><td>Phone Planet</td><td>Retail Pro</td><td>Rs 1,299</td><td>20 Sep</td><td><span class="tag green">Active</span></td></tr><tr><td>Mobile Hub</td><td>Retail Pro</td><td>Rs 1,299</td><td>16 Sep</td><td><span class="tag orange">Expiring</span></td></tr><tr><td>City Cell</td><td>Starter</td><td>Rs 799</td><td>11 Sep</td><td><span class="tag red">Expired</span></td></tr></table></div></div>'}function settings(C){C.innerHTML='<div class="grid2"><div class="panel"><h3>Business Profile</h3><div class="body form"><div class="f w6"><label>Business Name</label><input value="Galaxy Mobile Center"></div><div class="f w6"><label>Type</label><select><option>Wholesale + Retail</option></select></div><div class="f"><label>Currency</label><input value="PKR"></div><div class="f"><label>Printer</label><select><option>58mm Thermal</option><option>80mm Thermal</option></select></div></div></div><div class="panel"><h3>System Controls</h3><div class="body list"><div><span>Automatic Cloud Backup</span><b>ON</b></div><div><span>Password Verification on Save</span><b>ON</b></div><div><span>Debit Limit Control</span><b>ON</b></div><div><span>IMEI Duplicate Protection</span><b>ON</b></div><div><span>Allow Negative Stock</span><b>OFF</b></div></div></div></div>'}function showSearch(){let m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box"><h3>IMEI History Search</h3><div class="scan"><input id="q" value="352099001760481"><button class="btn primary" id="find">Search</button><button class="btn ghost" id="x">Close</button></div><div id="res"></div></div>';document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();m.querySelector('#find').onclick=()=>{let q=m.querySelector('#q').value,x=I.stock.find(s=>s[0]===q||s[0].endsWith(q));m.querySelector('#res').innerHTML=x?'<div class="summary"><div class="row"><span>Device</span><b>'+x[1]+' '+x[2]+' '+x[3]+'</b></div><div class="row"><span>Supplier</span><b>'+x[4]+'</b></div><div class="row"><span>Purchase Cost</span><b>'+rs(x[5])+'</b></div><div class="row"><span>Sale Price</span><b>'+rs(x[6])+'</b></div><div class="row total"><span>Status</span><span>'+x[7]+'</span></div></div><p class="note">Full production version records purchase, branch transfers, sale, return and warranty history for each IMEI.</p>':'<p class="note
