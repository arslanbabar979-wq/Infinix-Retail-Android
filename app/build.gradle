plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infinix.retailintelligence'
    compileSdk 35

    defaultConfig {
        applicationId 'com.infinix.retailintelligence'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
